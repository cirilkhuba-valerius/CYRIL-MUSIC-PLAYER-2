<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean Eyes</title>
    <link rel="shortcut icon" href="500x500.jpg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="song-style.css" />
  </head>
  <body>
    <div class="player-card">
      <div class="artwork-container">
        <img src="500x500.jpg" alt="Ocean Eyes" class="song-img" />
        <div class="glow-effect"></div>
      </div>

      <div class="song-info">
        <h1>CYRIL Music Player</h1>
        <h2>Ocean Eyes</h2>
        <p class="artist">Billie Eilish</p>
      </div>


      <audio
        id="audioPlayer"
        src="Ocean Eyes - Billie Eilish.mp3"
        loop
        autoplay
      ></audio>


      <div class="custom-controls">
        <div class="time-container">
          <span id="currentTime">0:00</span>
          <span id="duration">3:28</span>
        </div>
        
        <div class="progress-bar-container" id="progressBarContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="button-group">
          <button id="playPauseBtn" class="control-btn primary-btn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
        </div>
      </div>
    </div>


    <script>
      const audio = document.getElementById('audioPlayer');
      const playBtn = document.getElementById('playPauseBtn');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const progressBar = document.getElementById('progressBar');
      const progressContainer = document.getElementById('progressBarContainer');
      const currentTimeEl = document.getElementById('currentTime');
      const durationEl = document.getElementById('duration');


      audio.onplay = () => {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      };
      audio.onpause = () => {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      };

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('timeupdate', () => {
        const current = audio.currentTime;
        const duration = audio.duration || 208; 
        const percent = (current / duration) * 100;
        progressBar.style.width = percent + '%';
        
        let min = Math.floor(current / 60);
        let sec = Math.floor(current % 60);
        if (sec < 10) sec = '0' + sec;
        currentTimeEl.textContent = `${min}:${sec}`;
      });

      progressContainer.addEventListener('click', (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        audio.currentTime = (clickX / width) * duration;
      });
    </script>
  </body>
</html>
